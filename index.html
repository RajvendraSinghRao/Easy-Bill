<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EASY BILL</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: #eef2f7;
}

.header {
  background: #0d6efd;
  color: white;
  text-align: center;
  padding: 15px;
}

.container {
  padding: 10px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #ddd;
  padding: 6px;
  text-align: center;
  font-size: 13px;
}

.no-print { display: block; }

@media print {
  .no-print { display: none !important; }
  body { background: white; }

  /* Hide remove column */
  table th:last-child,
  table td:last-child {
    display: none;
  }
}
</style>

</head>

<body>

<div class="header">
<div id="shopTop"></div>
<b>EASY BILL</b><br>
<button onclick="changeShopName()" class="no-print">Change Shop Name</button>
</div>

<div class="container">

<div class="card">
<h2 id="shopBill" style="text-align:center;"></h2>
<hr>
<div id="custDisplay"></div>
</div>

<div class="card no-print">
<input id="custName" placeholder="Customer Name (optional)">
<input id="custMob" placeholder="+91 Mobile Number">
</div>

<div class="card no-print">
<select id="material"></select>
<input id="qty" type="number" placeholder="Quantity">
<button onclick="addItem()">Add Item</button>
</div>

<div class="card">
<table id="billTable">
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th class="no-print">X</th>
</tr>
</table>

<h3 id="grandTotal">Total: ₹0</h3>

<button class="no-print" onclick="window.print()">Print</button>
<button class="no-print" onclick="clearBill()">New Bill</button>
</div>

<div class="card no-print">
<h3>Add Material</h3>
<input id="matName" placeholder="Material Name">
<input id="matCompany" placeholder="Company (optional)">
<input id="matPrice" type="number" placeholder="Price">
<input id="matQty" type="number" placeholder="Quantity (optional)">
<button onclick="addMaterial()">Add Material</button>
</div>

<div class="card no-print">
<h3>Manage Materials</h3>
<div id="matList"></div>
</div>

</div>

<script>

// SHOP NAME
let shop = localStorage.getItem("shop");
if(!shop){
  shop = prompt("Enter your Shop Name:");
  if(!shop) shop = "My Shop";
  localStorage.setItem("shop", shop);
}

function updateShop(){
  shopTop.innerText = shop;
  shopBill.innerText = shop;
}

function changeShopName(){
  let newName = prompt("Enter new Shop Name:", shop);
  if(newName){
    shop = newName;
    localStorage.setItem("shop", shop);
    updateShop();
  }
}

updateShop();

// MOBILE FORMAT (+91)
custMob.addEventListener("input", function(){
  let val = this.value.replace(/\D/g,'');

  if(!val.startsWith("91")){
    val = "91" + val;
  }

  val = val.substring(0,12);
  this.value = "+" + val;
});

// MATERIALS
let materials = JSON.parse(localStorage.getItem("materials")) || [
  {name:"Cement", company:"UltraTech", price:350}
];

let total = 0;

function loadMaterials(){
  material.innerHTML = "";
  matList.innerHTML = "";

  materials.forEach((m,i)=>{
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = `${m.name}${m.company ? " - "+m.company : ""} (₹${m.price})`;
    material.appendChild(opt);

    let div = document.createElement("div");
    div.innerHTML = `${m.name} - ₹${m.price} 
    <button onclick="deleteMaterial(${i})">Delete</button>`;
    matList.appendChild(div);
  });

  localStorage.setItem("materials", JSON.stringify(materials));
}

loadMaterials();

function addMaterial(){
  let name = matName.value.trim();
  let company = matCompany.value.trim();
  let price = parseFloat(matPrice.value);

  if(!name || !price){
    alert("Enter material and price");
    return;
  }

  materials.push({name, company, price});
  loadMaterials();

  matName.value="";
  matCompany.value="";
  matPrice.value="";
  matQty.value="";
}

function deleteMaterial(i){
  materials.splice(i,1);
  loadMaterials();
}

function addItem(){
  let m = materials[material.value];
  let q = parseFloat(qty.value);

  if(!q){
    alert("Enter quantity");
    return;
  }

  let t = q * m.price;
  total += t;

  let row = billTable.insertRow();
  row.insertCell(0).innerText = m.name;
  row.insertCell(1).innerText = q;
  row.insertCell(2).innerText = m.price;
  row.insertCell(3).innerText = t;

  let del = row.insertCell(4);
  del.innerHTML = `<button onclick="removeRow(this,${t})">X</button>`;

  grandTotal.innerText = "Total: ₹" + total;

  showCustomer();
}

function removeRow(btn,val){
  btn.parentElement.parentElement.remove();
  total -= val;
  grandTotal.innerText = "Total: ₹" + total;
}

function showCustomer(){
  let name = custName.value.trim();
  let mob = custMob.value.replace(/\D/g,'');

  let mobileText = "";

  if(mob.length === 12){
    mobileText = "Mobile: +" + mob;
  }

  custDisplay.innerHTML = `
    ${name ? "Name: "+name+"<br>" : ""}
    ${mobileText}
  `;
}

function clearBill(){
  billTable.innerHTML = `
  <tr>
  <th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th class="no-print">X</th>
  </tr>`;
  total = 0;
  grandTotal.innerText = "Total: ₹0";
  custDisplay.innerHTML="";
}

</script>

</body>
</html>
