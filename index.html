<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EASY BILL</title>

<style>
body { font-family:'Segoe UI'; margin:0; background:#f5f7fa; }

.header {
  background:#0d6efd; color:white; text-align:center;
  padding:15px; font-size:20px; font-weight:bold;
}

.container { max-width:700px; margin:auto; padding:10px; }

.card {
  background:white; padding:15px; margin-bottom:12px;
  border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* BILL DESIGN */
.bill-box { border:2px solid #000; }

.bill-header { text-align:center; margin-bottom:10px; }
.bill-header h2 { margin:0; }
.bill-header p { margin:0; font-size:13px; }

.bill-info {
  display:flex; justify-content:space-between;
  font-size:13px; margin-bottom:10px;
}

table { width:100%; border-collapse:collapse; }
th { background:#000; color:white; }
th,td { border:1px solid #000; padding:6px; font-size:13px; text-align:center; }

.total-box { text-align:right; font-size:16px; font-weight:bold; margin-top:10px; }

input, select, button {
  width:100%; padding:10px; margin:5px 0;
  border-radius:6px; border:1px solid #ccc;
}

button { background:#0d6efd; color:white; border:none; }

.no-print { display:block; }

.print-popup {
  display:none; position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:white; padding:20px; border-radius:10px;
}

/* PRINT */
@media print {
  .no-print, .print-popup { display:none !important; }
  table th:last-child, table td:last-child { display:none; }

  body.thermal {
    width:80mm;
    margin:0;
  }

  body.thermal .bill-box {
    padding:5px;
    border:none;
  }

  body.thermal table {
    width:100%;
    table-layout:fixed;
  }

  body.thermal th,
  body.thermal td {
    font-size:10px;
    padding:2px;
    word-wrap:break-word;
  }

  body.thermal th:nth-child(1),
  body.thermal td:nth-child(1) { width:25%; }

  body.thermal th:nth-child(2),
  body.thermal td:nth-child(2) { width:15%; }

  body.thermal th:nth-child(3),
  body.thermal td:nth-child(3) { width:10%; }

  body.thermal th:nth-child(4),
  body.thermal td:nth-child(4) { width:15%; }

  body.thermal th:nth-child(5),
  body.thermal td:nth-child(5) { width:10%; }

  body.thermal th:nth-child(6),
  body.thermal td:nth-child(6) { width:25%; }
}
</style>
</head>

<body>

<div class="header">
EASY BILL<br>
<button onclick="changeShopName()" class="no-print">Change Shop Name</button>
<button onclick="changeShopMobile()" class="no-print">Change Mobile</button>
</div>

<div class="container">

<div class="card bill-box">

<div class="bill-header">
<h2 id="shopTop"></h2>
<p id="shopMobile"></p>
<p>Invoice</p>
</div>

<div class="bill-info" id="custDisplay"></div>

<table id="billTable">
<tr>
<th>Item</th><th>Weight</th><th>Qty</th><th>Price</th><th id="gstHead">GST</th><th>Total</th><th class="no-print">X</th>
</tr>
</table>

<div class="total-box" id="grandTotal">Total: ₹0</div>

</div>

<div class="card no-print">
<input id="custName" placeholder="Customer Name (optional)">
<input id="custMob" placeholder="+91 Mobile (optional)">
</div>

<div class="card no-print">
<input id="searchMat" placeholder="Search Material">
<select id="material"></select>
<input id="qty" type="number" placeholder="Quantity">
<button onclick="addItem()">Add Item</button>
</div>

<div class="card no-print">
<button onclick="openPrint()">Print</button>
<button onclick="clearBill()">New Bill</button>
</div>

<div class="card no-print">
<h3>Add Material</h3>
<input id="matName" placeholder="Material Name">
<input id="matCompany" placeholder="Company (optional)">
<input id="matWeight" placeholder="Weight (e.g. 50kg)">
<input id="matPrice" type="number" placeholder="Price">
<input id="matQty" type="number" placeholder="Quantity">
<input id="matGST" type="number" placeholder="GST % (optional)">
<button onclick="addMaterial()">Add</button>
</div>

<div class="card no-print">
<h3>Materials</h3>
<div id="matList"></div>
</div>

</div>

<!-- PRINT POPUP -->
<div class="print-popup" id="printBox">
<h3>Select Print Type</h3>
<button onclick="doPrint('normal')">Normal</button>
<button onclick="doPrint('thermal')">Thermal</button>
<button onclick="closePrint()">Cancel</button>
</div>

<script>

// SHOP
let shop = localStorage.getItem("shop");
if(!shop){
  shop = prompt("Enter Shop Name:");
  localStorage.setItem("shop", shop || "My Shop");
}
shopTop.innerText = shop;

// 👉 SHOP MOBILE (ADDED)
let shopMob = localStorage.getItem("shopMob");
if(!shopMob){
  let m = prompt("Enter Shop Mobile Number:");
  if(m){
    m = m.replace(/\D/g,'');
    if(!m.startsWith("91")) m = "91"+m;
    m = "+" + m.substring(0,12);
    shopMob = m;
    localStorage.setItem("shopMob", m);
  }
}
shopMobile.innerText = shopMob ? "Mobile: " + shopMob : "";

function changeShopName(){
  let n = prompt("Enter new Shop Name:", shop);
  if(n){
    shop=n;
    localStorage.setItem("shop",n);
    shopTop.innerText=n;
  }
}

// MOBILE (CUSTOMER)
custMob.addEventListener("input", function(){
  let v=this.value.replace(/\D/g,'');
  if(v && !v.startsWith("91")) v="91"+v;
  this.value = v ? "+"+v.substring(0,12) : "";
});

// DATA
let materials = JSON.parse(localStorage.getItem("materials")) || [];
let total = 0;
let hasGST = false;

// LOAD
function loadMaterials(list=materials){
  material.innerHTML="";
  matList.innerHTML="";

  list.forEach((m,i)=>{
    let opt=document.createElement("option");
    opt.value=i;
    opt.text=`${m.name} ${m.weight||""} ₹${m.price}`;
    material.appendChild(opt);

    let d=document.createElement("div");
    d.innerHTML=`${m.name} ${m.weight||""} ₹${m.price}
    <button onclick="deleteMaterial(${i})">Delete</button>`;
    matList.appendChild(d);
  });

  localStorage.setItem("materials", JSON.stringify(materials));
}
loadMaterials();

// SEARCH
searchMat.addEventListener("input", function(){
  let v=this.value.toLowerCase();
  let f=materials.filter(m=>m.name.toLowerCase().includes(v));
  loadMaterials(f);
});

// ADD MATERIAL
function addMaterial(){
  let name=matName.value.trim();
  let company=matCompany.value.trim();
  let weight=matWeight.value.trim();
  let price=parseFloat(matPrice.value);
  let qty=parseFloat(matQty.value)||0;
  let gst=parseFloat(matGST.value)||0;

  if(!name||isNaN(price)) return alert("Enter valid data");

  materials.push({name,company,weight,price,qty,gst});
  loadMaterials();

  matName.value=matCompany.value=matWeight.value=matPrice.value=matQty.value=matGST.value="";
}

// DELETE
function deleteMaterial(i){
  materials.splice(i,1);
  loadMaterials();
}

// ADD ITEM
function addItem(){
  let m=materials[material.value];
  let q=Number(qty.value);

  if(!m||q<=0||isNaN(q)) return alert("Enter valid quantity");

  let price=Number(m.price)||0;
  let gst=Number(m.gst)||0;

  let base=q*price;
  let gstAmt=base*(gst/100);
  let t=base+gstAmt;

  if(gst>0) hasGST=true;

  total+=t;

  let r=billTable.insertRow();
  r.insertCell(0).innerText=m.name;
  r.insertCell(1).innerText=(m.weight && m.weight.trim()!=="")?m.weight:"-";
  r.insertCell(2).innerText=q;
  r.insertCell(3).innerText=price;
  r.insertCell(4).innerText=gst>0?gst+"%":"";
  r.insertCell(5).innerText=t.toFixed(2);

  let del=r.insertCell(6);
  del.innerHTML=`<button onclick="removeRow(this,${t})">X</button>`;

  updateGSTColumn();
  grandTotal.innerText="Total: ₹"+total.toFixed(2);

  showCustomer();
}

// GST COLUMN
function updateGSTColumn(){
  let col=4;
  for(let r of billTable.rows){
    if(!hasGST){
      if(r.cells[col]) r.cells[col].style.display="none";
    } else {
      if(r.cells[col]) r.cells[col].style.display="";
    }
  }
}

// REMOVE
function removeRow(btn,val){
  btn.parentElement.parentElement.remove();
  total-=val;
  grandTotal.innerText="Total: ₹"+total.toFixed(2);
}

// CUSTOMER
function showCustomer(){
  let n=custName.value.trim();
  let m=custMob.value.replace(/\D/g,'');

  custDisplay.innerHTML=
    `<div>${n?("Name: "+n):""}</div>
     <div>${m.length===12?("Mobile: +"+m):""}</div>`;
}

// CLEAR
function clearBill(){ location.reload(); }

// PRINT
function openPrint(){ printBox.style.display="block"; }
function closePrint(){ printBox.style.display="none"; }

function doPrint(type){
  if(type==="thermal"){
    document.body.classList.add("thermal");
  } else {
    document.body.classList.remove("thermal");
  }
  printBox.style.display="none";
  window.print();
}

function changeShopMobile(){
  let m = prompt("Enter new Mobile Number:", shopMob || "");
  if(m){
    m = m.replace(/\D/g,'');
    if(!m.startsWith("91")) m = "91"+m;
    m = "+" + m.substring(0,12);

    shopMob = m;
    localStorage.setItem("shopMob", m);
    shopMobile.innerText = "Mobile: " + m;
  }
}
  
</script>

</body>
</html>
