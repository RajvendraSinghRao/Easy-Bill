<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EASY BILL</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #eef2f7;
}

.header {
  background: #007bff;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 15px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

input, select, button {
  padding: 8px;
  margin: 5px;
}

button {
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background: #0056b3;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

.flex {
  display: flex;
  flex-wrap: wrap;
}

.flex input, .flex select {
  flex: 1;
  min-width: 150px;
}

.no-print {
  display: block;
}

/* PRINT */
@media print {
  .no-print {
    display: none;
  }
  body {
    background: white;
  }
}
</style>

</head>

<body>

<div class="header no-print">
<h2 id="shopNameTop">EASY BILL</h2>
<button onclick="changeShopName()">Change Shop Name</button>
</div>

<div class="container">

<!-- BILL HEADER -->
<div class="card">
<h2 id="shopNameBill" style="text-align:center;"></h2>
<h3 style="text-align:center;">EASY BILL</h3>
</div>

<!-- CUSTOMER -->
<div class="card no-print">
<input id="custName" placeholder="Customer Name">
<input id="custMob" placeholder="Mobile Number">
</div>

<!-- ADD ITEM -->
<div class="card no-print">
<div class="flex">
<select id="material"></select>
<input id="qty" type="number" placeholder="Quantity">
<button onclick="addItem()">Add</button>
</div>
</div>

<!-- BILL -->
<div class="card">
<table id="billTable">
<tr>
<th>Material</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</table>

<h3 id="grandTotal">Total: ₹0</h3>

<button class="no-print" onclick="window.print()">🖨 Print</button>
<button class="no-print" onclick="clearBill()">New Bill</button>
</div>

<!-- ADD MATERIAL -->
<div class="card no-print">
<h3>Add Material</h3>

<input id="matName" placeholder="Material Name">
<input id="matCompany" placeholder="Company (Optional)">
<input id="matPrice" type="number" placeholder="Price">

<button onclick="addMaterial()">Add</button>
</div>

</div>

<script>

// SHOP NAME SYSTEM
let shopName = localStorage.getItem("shopName");

if(!shopName){
  shopName = prompt("Enter your Shop Name:");
  localStorage.setItem("shopName", shopName);
}

document.getElementById("shopNameTop").innerText = shopName;
document.getElementById("shopNameBill").innerText = shopName;

function changeShopName(){
  let newName = prompt("Enter new Shop Name:");
  if(newName){
    localStorage.setItem("shopName", newName);
    location.reload();
  }
}

// MATERIALS
let defaultMaterials = [
  {name:"Cement", company:"UltraTech", price:350},
  {name:"Sand", company:"", price:5000},
  {name:"Aggregate", company:"", price:4000},
  {name:"Steel", company:"TATA", price:70}
];

let materials = JSON.parse(localStorage.getItem("materials")) || defaultMaterials;

let total = 0;

// LOAD MATERIALS
function loadMaterials(){
  material.innerHTML = "";

  materials.forEach((m,i)=>{
    let opt = document.createElement("option");
    let companyText = m.company ? " - " + m.company : "";
    opt.value = i;
    opt.text = `${m.name}${companyText} (₹${m.price})`;
    material.appendChild(opt);
  });
}

loadMaterials();

// ADD MATERIAL
function addMaterial(){
  let name = matName.value.trim();
  let company = matCompany.value.trim();
  let price = parseFloat(matPrice.value);

  if(!name || !price){
    alert("Enter material and price");
    return;
  }

  materials.push({name, company, price});
  localStorage.setItem("materials", JSON.stringify(materials));

  loadMaterials();

  matName.value="";
  matCompany.value="";
  matPrice.value="";
}

// ADD ITEM
function addItem(){
  let m = materials[material.value];
  let q = parseFloat(qty.value);

  if(!q){
    alert("Enter quantity");
    return;
  }

  let t = q * m.price;
  total += t;

  let row = billTable.insertRow();
  row.insertCell(0).innerText = m.name + (m.company ? " ("+m.company+")" : "");
  row.insertCell(1).innerText = q;
  row.insertCell(2).innerText = m.price;
  row.insertCell(3).innerText = t;

  grandTotal.innerText = "Total: ₹" + total;

  qty.value="";
}

// CLEAR BILL
function clearBill(){
  billTable.innerHTML = `
  <tr>
    <th>Material</th>
    <th>Qty</th>
    <th>Price</th>
    <th>Total</th>
  </tr>`;
  total = 0;
  grandTotal.innerText = "Total: ₹0";
}

</script>

</body>
</html>
